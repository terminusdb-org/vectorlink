# Phase-0 spike workspace (throwaway — NOT part of the tdb-search build).
# One workspace so the heavy lance/arrow dependency tree compiles ONCE and is
# shared across all spike binaries via a single target/ dir.
# See projects/2026-06-terminusdb-vectorlink/specs/11-phase0-spike-plan.md.

[workspace]
resolver = "2"
members = [
    "lance-branch",
    "layer-index",
    "tokenizer",
    "fastembed-inproc",
]

[workspace.dependencies]
lance = "=7.0.0"
lance-table = "=7.0.0"
lancedb = "=0.30.0"
arrow-array = "58"
arrow-schema = "58"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
tokenizers = "0.23"
