[package]
name = "spike-fastembed-inproc"
version = "0.0.0"
edition = "2021"
publish = false

# Phase-0 spike: in-process embedding of nomic-embed-text-v2-moe via fastembed
# (candle-backed, F16, no sidecar). Proves the indexer can own the model in-process.

[dependencies]
fastembed = { version = "5", features = ["nomic-v2-moe"] }
# Device/DType come from candle_core (fastembed does not re-export them).
candle-core = "0.10"
