# tdb-search self-contained stack (3-service, CPU-only).
#
# Canonical deployment: terminusdb + tdb-search + embeddings (Ollama).
# No external network dependency after the one-time model pull.
# The embedding sidecar is Ollama serving nomic-embed-text-v2-moe (Q8_0 GGUF).

services:
  # TerminusDB — renders embedding text, pushes deltas to the indexer, fronts search.
  terminusdb:
    image: terminusdb/terminusdb-server:latest
    pull_policy: missing
    environment:
      - TERMINUSDB_SERVER_PORT=6363
      - "TERMINUSDB_ADMIN_PASS=${TERMINUSDB_ADMIN_PASS:-root}"
    ports:
      # Host 6363/6364 commonly taken by a dev TerminusDB; use 6365.
      - "127.0.0.1:6365:6363"
    volumes:
      - terminusdb-storage:/app/terminusdb/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6363/api/info || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # Ollama embedding sidecar — serves nomic-embed-text-v2-moe via /v1/embeddings.
  # CPU-only (no GPU required). The model is created on first start via the init service.
  embeddings:
    image: ollama/ollama:latest
    pull_policy: missing
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # One-shot init: pull the nomic model if not already present.
  embeddings-init:
    image: ollama/ollama:latest
    pull_policy: missing
    depends_on:
      embeddings:
        condition: service_healthy
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=http://embeddings:11434
    entrypoint: ["bash", "-c"]
    command:
      - |
        ollama pull hf.co/nomic-ai/nomic-embed-text-v2-moe-GGUF:Q8_0 || true
        ollama cp hf.co/nomic-ai/nomic-embed-text-v2-moe-GGUF:Q8_0 nomic-embed-v2 2>/dev/null || true
        echo "Model ready."
    restart: "no"

  # tdb-search indexer — the search engine itself.
  tdb-search:
    build: .
    environment:
      - TDB_SEARCH_ADMIN_USER=admin
      - "TDB_SEARCH_ADMIN_SECRET=${TDB_SEARCH_ADMIN_SECRET:-root}"
      - TDB_SEARCH_EMBED_PROVIDER=openai_compatible
      - TDB_SEARCH_EMBED_URL=http://embeddings:11434
      - TDB_SEARCH_MODEL=nomic-embed-v2
      - TDB_SEARCH_DIM=768
      - TDB_SEARCH_DATA_DIR=/data
      - TDB_SEARCH_TOKENIZER_PATH=/opt/tdb-search/tokenizer.json
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - tdb-search-data:/data
    depends_on:
      terminusdb:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  terminusdb-storage:
  ollama-models:
  tdb-search-data:
