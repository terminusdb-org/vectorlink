# Native ARM64 Docker image build for vectorlink.
#
# Builds the production Dockerfile on ubuntu-22.04-arm (native ARM64), saves
# the image as a gzipped tarball artifact for the publish workflow to consume.

name: ARM64 Image Build

on:
  workflow_dispatch:
  workflow_call:

jobs:
  arm64_build:
    name: Build (arm64)
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: ghcr.io/terminusdb-org/vectorlink:local
          outputs: type=docker,dest=vectorlink-arm64.tar
          # Per-arch scope so this cache never collides with amd64 layers.
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Compress image
        run: gzip vectorlink-arm64.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: vectorlink-arm64
          path: vectorlink-arm64.tar.gz
          retention-days: 1
