# CI Gate — lint + test for vectorlink.
#
# Pipeline:
#   1. build-release  — compile release binary, cache deps, upload artifact
#   2. lint           — clippy + eslint + openapi (parallel, no build needed)
#   3. unit-tests     — cargo test against the release binary
#   4. integration    — mocha contract suite against live engine + Ollama sidecar
#   5. docker-publish — build multi-arch image, push to GHCR (main + tags only)
#
# Caching: Swatinem/rust-cache@v2 keys on Cargo.lock so the cargo registry,
# git checkouts, and target/ are reused across all Rust jobs and across runs.
# The release binary is built once and passed as an artifact to downstream jobs.
#
# Required repo settings:
#   - GITHUB_TOKEN permissions: packages:write (declared on docker-publish job)
#   - Package visibility: ghcr.io/terminusdb-org/vectorlink accessible to consumers

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to run CI against"
        required: false
        default: "main"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ─── Build release binary (shared by unit + integration tests) ───────────
  build-release:
    name: Build (release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            g++ \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ hashFiles('Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: vectorlink-release-bin
          path: target/release/vectorlink
          retention-days: 1

  # ─── Lint (parallel with build, no binary needed) ────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            g++ \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ hashFiles('Cargo.lock') }}
      - name: Clippy (all targets, all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

  openapi-lint:
    name: OpenAPI Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli

      - name: Lint OpenAPI spec
        run: redocly lint openapi.yaml

  js-lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint --ext .js tests/

  # ─── Unit tests (cargo test against release build) ───────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            g++ \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ hashFiles('Cargo.lock') }}

      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: vectorlink-release-bin
          path: target/release

      - name: Make binary executable
        run: chmod +x target/release/vectorlink

      - name: Run cargo test
        run: cargo test --all-features --release

  # ─── Integration tests (mocha against live engine + Ollama) ──────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl3 \
            ca-certificates \
            curl

      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: vectorlink-release-bin
          path: target/release

      - name: Make binary executable
        run: chmod +x target/release/vectorlink

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install JS test dependencies
        run: npm ci

      - name: Start Ollama embedding sidecar
        run: |
          docker run -d --name ollama \
            -p 127.0.0.1:11434:11434 \
            -v ollama-models:/root/.ollama \
            ollama/ollama:latest

          # Wait for Ollama to be ready
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama is ready"
              break
            fi
            sleep 1
          done

          # Pull the embedding model
          echo "Pulling nomic-embed-text-v2-moe model..."
          docker exec ollama ollama pull nomic-embed-text-v2-moe

      - name: Start vectorlink engine
        run: |
          mkdir -p /tmp/vectorlink-ci-data
          VECTORLINK_ADMIN_USER=admin \
          VECTORLINK_ADMIN_SECRET=root \
          VECTORLINK_EMBED_PROVIDER=openai_compatible \
          VECTORLINK_EMBED_URL=http://127.0.0.1:11434 \
          VECTORLINK_MODEL=nomic-embed-text-v2-moe \
          VECTORLINK_DIM=768 \
          VECTORLINK_DATA_DIR=/tmp/vectorlink-ci-data \
          VECTORLINK_TOKENIZER_PATH=$GITHUB_WORKSPACE/assets/tokenizer.json.bz2 \
          RUST_LOG=info \
          ./target/release/vectorlink &
          echo $! > /tmp/vectorlink.pid

          # Wait for engine readiness
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:8080/health/live >/dev/null 2>&1; then
              echo "vectorlink engine is live"
              break
            fi
            sleep 0.3
          done

          # Verify engine is actually up
          if ! curl -fsS http://127.0.0.1:8080/health/live >/dev/null 2>&1; then
            echo "ERROR: vectorlink did not become live"
            cat /tmp/vectorlink-test.log 2>/dev/null || true
            exit 1
          fi

      - name: Run mocha integration suite
        env:
          VECTORLINK_URL: http://127.0.0.1:8080
          VECTORLINK_ADMIN_USER: admin
          VECTORLINK_ADMIN_SECRET: root
        run: npx mocha --timeout 60000

      - name: Stop vectorlink engine
        if: always()
        run: |
          if [ -f /tmp/vectorlink.pid ]; then
            kill $(cat /tmp/vectorlink.pid) 2>/dev/null || true
          fi

      - name: Stop Ollama
        if: always()
        run: docker rm -f ollama 2>/dev/null || true

  # ─── E2e tests (vectorlink + TerminusDB plugin integration) ─────────────
  # Starts vectorlink (7372) + TerminusDB (7373) + Ollama, then runs the
  # e2e mocha suite that exercises the TerminusDB plugin proxy endpoints.
  e2e-tests:
    name: E2E Tests (TerminusDB)
    runs-on: ubuntu-latest
    needs: build-release
    # Disabled until TerminusDB Docker image includes search plugins.
    # The official terminusdb/terminusdb-server:latest image does not ship
    # tdb_search.pl or search_resolve.pl, so all proxy endpoint tests are
    # testing against a server that returns 404 for every plugin route.
    # Re-enable once the TerminusDB Docker image is built with plugins.
    if: false

    steps:
      - name: Checkout vectorlink repository
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl3 \
            ca-certificates \
            curl

      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: vectorlink-release-bin
          path: target/release

      - name: Make binary executable
        run: chmod +x target/release/vectorlink

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install JS test dependencies
        run: npm ci

      - name: Start Ollama embedding sidecar
        run: |
          docker run -d --name ollama \
            -p 127.0.0.1:11434:11434 \
            -v ollama-models:/root/.ollama \
            ollama/ollama:latest

          # Wait for Ollama to be ready
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama is ready"
              break
            fi
            sleep 1
          done

          # Pull the embedding model
          echo "Pulling nomic-embed-text-v2-moe model..."
          docker exec ollama ollama pull nomic-embed-text-v2-moe

      - name: Start vectorlink engine
        run: |
          mkdir -p /tmp/vectorlink-e2e-data
          VECTORLINK_PORT=7372 \
          VECTORLINK_ADMIN_USER=admin \
          VECTORLINK_ADMIN_SECRET=root \
          VECTORLINK_EMBED_PROVIDER=openai_compatible \
          VECTORLINK_EMBED_URL=http://127.0.0.1:11434 \
          VECTORLINK_MODEL=nomic-embed-text-v2-moe \
          VECTORLINK_DIM=768 \
          VECTORLINK_DATA_DIR=/tmp/vectorlink-e2e-data \
          VECTORLINK_TOKENIZER_PATH=$GITHUB_WORKSPACE/assets/tokenizer.json.bz2 \
          RUST_LOG=info \
          ./target/release/vectorlink &
          echo $! > /tmp/vectorlink.pid

          # Wait for engine readiness
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:7372/health/live >/dev/null 2>&1; then
              echo "vectorlink engine is live"
              break
            fi
            sleep 0.3
          done

          if ! curl -fsS http://127.0.0.1:7372/health/live >/dev/null 2>&1; then
            echo "ERROR: vectorlink did not become live"
            exit 1
          fi

      - name: Start TerminusDB
        run: |
          docker run -d --name terminusdb \
            --network host \
            -e TERMINUSDB_SERVER_PORT=7373 \
            -e TERMINUSDB_ADMIN_PASS=root \
            -e TERMINUSDB_INDEXER_BACKEND=http_vectorlink \
            -e TERMINUSDB_VECTORLINK_ENDPOINT=http://127.0.0.1:7372 \
            terminusdb/terminusdb-server:latest

          # Wait for TerminusDB to be ready
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7373/ >/dev/null 2>&1; then
              echo "TerminusDB is ready"
              break
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:7373/ >/dev/null 2>&1; then
            echo "ERROR: TerminusDB did not become ready"
            docker logs terminusdb 2>&1 | tail -50
            exit 1
          fi

      - name: Run e2e mocha suite
        env:
          VECTORLINK_URL: http://localhost:7372
          VECTORLINK_ADMIN_USER: admin
          VECTORLINK_ADMIN_SECRET: root
        run: npx mocha --config .mocharc.e2e.js --timeout 120000

      - name: Stop vectorlink engine
        if: always()
        run: |
          if [ -f /tmp/vectorlink.pid ]; then
            kill $(cat /tmp/vectorlink.pid) 2>/dev/null || true
          fi

      - name: Stop TerminusDB
        if: always()
        run: docker rm -f terminusdb 2>/dev/null || true

      - name: Stop Ollama
        if: always()
        run: docker rm -f ollama 2>/dev/null || true

  # ─── Docker build + publish to GHCR ──────────────────────────────────────
  docker-publish:
    name: Docker Publish
    runs-on: ubuntu-latest
    needs: [build-release, clippy, openapi-lint, js-lint, unit-tests, integration-tests]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          # Lowercase the image name (GHCR requirement)
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')

          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            TAGS="${IMAGE}:dev,${IMAGE}:dev-${GITHUB_SHA::7}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="${IMAGE}:${VERSION}"
            # For non-prerelease tags: also tag :latest and :vN (major)
            case "$VERSION" in
              *-rc*|*-beta*|*-alpha*|*-dev*)
                ;;
              *)
                MAJOR=$(echo "$VERSION" | cut -d '.' -f 1)
                TAGS="${TAGS},${IMAGE}:latest,${IMAGE}:${MAJOR}"
                ;;
            esac
          else
            TAGS="${IMAGE}:ci-${GITHUB_SHA::7}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Computed tags: ${TAGS}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
