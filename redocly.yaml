# Redocly config — strict OpenAPI linting + docs build for vectorlink.
#
# The OpenAPI lint is a hard gate: `make lint` must pass before any commit. We
# start from Redocly's `recommended` ruleset promoted so that everything is an
# error (no warnings slip through), then relax only the two rules that
# legitimately do not apply to this contract, each with justification.

apis:
  vectorlink:
    root: ./openapi.yaml

extends:
  - recommended

rules:
  # ── promote the whole recommended set to error: no warnings, strict gate ──
  # (Redocly applies severities per-rule below; anything not overridden inherits
  #  `recommended`. The overrides below either raise to error or justify-relax.)
  struct: error
  no-unused-components: error
  operation-operationId: error
  operation-operationId-unique: error
  operation-2xx-response: error
  no-identical-paths: error
  no-ambiguous-paths: error
  path-declaration-must-exist: error
  security-defined: error
  spec-components-invalid-map-name: error

  # ── justified relaxations (NOT silent — documented) ──

  # WHY: the engine binds locally and runs on a private network behind a front
  # door; `http://localhost:8080` is the accurate default server, not a
  # placeholder. INVARIANT: real deployments override the server URL.
  # CONSEQUENCE of relaxing: none — the URL is intentionally local.
  no-server-example.com: off

  # WHY: /health/live and /health/ready are orchestrator probes with no
  # client-error path — liveness is always 200 (process up); readiness is
  # 200 (serveable) or 503 (not yet). There is no 4XX a probe can return.
  # INVARIANT: every FUNCTIONAL endpoint still carries 4XX (struct + manual
  # review enforce it). CONSEQUENCE of relaxing: probes aren't forced to invent
  # a meaningless 4XX. Scoped as a warning so it stays visible, not silenced.
  operation-4xx-response: warn
