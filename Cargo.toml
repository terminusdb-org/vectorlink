[package]
name = "tdb-search"
version = "0.1.0"
edition = "2021"
description = "Standalone semantic search engine — push-indexed, versioned per commit."
license = "Apache-2.0"

[dependencies]
arrow-array = "58"
arrow-schema = "58"
axum = { version = "0.8", features = ["macros"] }
form_urlencoded = "1"
futures = "0.3"
base64 = "0.22"
hyper = { version = "1", features = ["full"] }
lance = "=7.0.0"
lance-index = "=7.0.0"
lancedb = "=0.30.0"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokenizers = "0.23"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

[[bin]]
name = "tdb-search"
path = "src/main.rs"

[[bin]]
name = "tdb-search-load"
path = "src/bin/load.rs"

[profile.release]
lto = "thin"
strip = true
