[package]
name = "vectorlink"
version = "2.0.0"
edition = "2021"
description = "Standalone semantic search engine — push-indexed, versioned per commit."
license = "Apache-2.0"
autobenches = false

[dependencies]
arrow-array = "58"
arrow-schema = "58"
axum = { version = "0.8", features = ["macros"] }
bzip2 = "0.5"
form_urlencoded = "1"
futures = "0.3"
base64 = "0.22"
hyper = { version = "1", features = ["full"] }
# Lance: local-disk only — disable all cloud object-store backends (aws/azure/gcp/oss/tencent),
# huggingface (not our embedding path), and geo (no spatial queries). This eliminates 87+ transitive
# dependencies (aws-sdk-*, object-store cloud modules, etc.) and cuts binary size ~40%.
lance = { version = "=7.0.0", default-features = false }
lance-index = "=7.0.0"
lance-linalg = "=7.0.0"
rand = "0.9"
reqwest = { version = "0.12", features = ["json"] }
roaring = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sled = "0.34"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
uuid = { version = "1", features = ["v4"] }
ruzstd = "0.8"

tempfile = "3"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "vectorlink"
path = "src/main.rs"

[[bin]]
name = "vectorlink-load"
path = "src/bin/load.rs"

# Note: throwaway measurement tools (scale_evidence, crossover_measurement)
# live under benches/ and are NOT declared as [[bin]] targets here — they are
# run ad hoc during perf investigation, not shipped or built by `cargo build`
# / the production image / CI. Declaring them would force their (untracked)
# source to exist on every clean checkout (CI fails target resolution otherwise).

# `make pr` profile — fast incremental relinks (no LTO). Used by the pre-commit gate.
# A one-line change should relink in seconds, not minutes.
[profile.release]
strip = true
# No LTO here — `make pr` must be fast (incremental). LTO only in the publish step.

# Separate production profile for shipping images. Activated via:
#   cargo build --profile production
# Only used by `make release-image`, NOT by `make pr` or `make test-integration`.
[profile.production]
inherits = "release"
lto = "thin"
opt-level = "s"
codegen-units = 1
